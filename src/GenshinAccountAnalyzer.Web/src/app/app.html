<nav class="navbar navbar-expand-lg gaa-nav sticky-top">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand fw-semibold" routerLink="/">
      Genshin Account Analyzer
    </a>

    @if (store.hasData()) {
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#gaaNav"
        aria-controls="gaaNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="gaaNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          @for (link of navLinks; track link.path) {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="link.path" routerLinkActive="active">
                {{ language.language() === 'ru' ? link.ru : link.en }}
              </a>
            </li>
          }
        </ul>
      </div>
    }

    <div class="d-flex align-items-center gap-2">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="language.toggle()"
        [attr.aria-label]="'Toggle language'"
      >
        {{ language.language() === 'ru' ? 'EN' : 'RU' }}
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="theme.toggle()"
        [attr.aria-label]="'Toggle theme'"
      >
        @if (theme.theme() === 'dark') {
          ☀️
        } @else {
          🌙
        }
      </button>
    </div>
  </div>
</nav>

<main class="container-fluid px-3 px-lg-4 py-4">
  <router-outlet />
</main>
